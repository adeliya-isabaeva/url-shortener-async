services:
  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"  # Чтобы ты могла ходить в Swagger/браузер по localhost:8001
    environment:
      LINK_TTL_SECONDS: ${LINK_TTL_SECONDS:-3600}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  test:
    build: .
    # Теперь здесь ТОЛЬКО тесты. Приложение уже поднято в сервисе app.
    command: pytest -v
    environment:
      LINK_TTL_SECONDS: "86400"
      REDIS_URL: "redis://redis:6379"
      # Важно: стучимся по имени сервиса app (внутренняя сеть Docker)
      BASE_URL: "http://app:8000"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 40s

volumes:
  redis_data:
