version: "3.8"

services:
  app:
    build: .
    # Важно: путь к приложению должен совпадать с тем, где лежит main.py
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    environment:
      # Обязательно задай дефолтное значение, если переменная не передана в shell
      LINK_TTL_SECONDS: ${LINK_TTL_SECONDS:-3600}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  test:
    build: .
    command: pytest -v
    environment:
      LINK_TTL_SECONDS: "86400"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s              # Проверяем чаще (каждые 2 сек)
      timeout: 3s               # Ждем ответа меньше (3 сек)
      retries: 10               # Увеличили количество попыток до 10!
      start_period: 40s        # ДАЕМ ВРЕМЯ НА ЗАПУСК (Redis в Alpine стартует чуть дольше)

volumes:
  redis_data:
